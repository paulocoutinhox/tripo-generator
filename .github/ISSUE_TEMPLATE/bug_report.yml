name: Bug report
description: Report incorrect Tripo Generator behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never paste your API key, `.env` contents or authorization headers. Task IDs are safe to share.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the function call or example, prompt, profile and animations used.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and task IDs
      description: Paste the console output and the task IDs printed during generation.
      render: text
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
