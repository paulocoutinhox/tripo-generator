name: Feature request
description: Propose a focused Tripo Generator capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the concrete asset workflow that needs this capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API or behavior you expect, with links to the official Tripo documentation when relevant.
    validations:
      required: true
