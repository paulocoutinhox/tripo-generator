[project]
name = "tripo-generator"
version = "0.1.0"
description = "Generate textured static items and rigged, animated humanoid characters as GLB files from text prompts using the Tripo API v3."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Paulo Coutinho" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/paulocoutinhox/tripo-generator"
Issues = "https://github.com/paulocoutinhox/tripo-generator/issues"
Source = "https://github.com/paulocoutinhox/tripo-generator"

[dependency-groups]
dev = ["ruff>=0.13"]

[tool.uv]
package = false

[tool.ruff]
line-length = 320
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
